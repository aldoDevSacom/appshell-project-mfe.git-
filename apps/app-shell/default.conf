server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sirve estáticos y hace fallback para rutas SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: cache corto para assets compilados
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
